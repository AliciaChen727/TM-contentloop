name: Publish Scheduled Drafts

on:
  schedule:
    # 每 15 分鐘檢查一次到期的排程草稿（UTC）。靜默時段/Kill Switch 由後端判斷。
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled Threads publishing
        run: |
          body=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST https://tm-contentloop.vercel.app/api/cron/publish-scheduled \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          status=$(echo "$body" | grep "HTTP_STATUS:" | cut -d: -f2)
          response=$(echo "$body" | grep -v "HTTP_STATUS:")
          echo "Response status: $status"
          echo "Response body: $response"
          if [ "$status" != "200" ]; then
            echo "Scheduled publish failed with status $status"
            exit 1
          fi
          echo "Scheduled publish completed successfully"
