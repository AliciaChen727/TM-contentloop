name: Quality Re-score Batch

on:
  schedule:
    # 每日 05:30 UTC（台灣 13:30）。重評有 humanAction 的 feedback +
    # 採納滿 7 天算 adMetricsAfter + 更新 qualityStats。
    - cron: '30 5 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  eval-rescore:
    runs-on: ubuntu-latest
    steps:
      - name: Re-score quality feedback for all pages
        run: |
          body=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST https://tm-contentloop.vercel.app/api/cron/eval-rescore \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          status=$(echo "$body" | grep "HTTP_STATUS:" | cut -d: -f2)
          response=$(echo "$body" | grep -v "HTTP_STATUS:")
          echo "Response status: $status"
          echo "Response body: $response"
          if [ "$status" != "200" ]; then
            echo "Eval re-score failed with status $status"
            exit 1
          fi
          echo "Eval re-score completed successfully"
