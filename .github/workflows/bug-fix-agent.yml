# Phase 3B Slice 19 + Phase 3C — AI 任務 agent（修 bug / 開發新功能，雙重人工關卡）
# 關卡1：人工觸發（Actions 頁 or Telegram ops-bot，輸入 Issue 編號）
# 關卡2：agent 只會開 PR（無 merge 權限），人工 review 後才 merge
# 第三道驗證：Vercel 對 PR 自動跑 preview build
name: AI Bug Fix Agent
run-name: "🤖 ${{ inputs.task_type == 'feature' && '開發' || '修復' }} Issue #${{ inputs.issue_number }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: '要處理的 GitHub Issue 編號'
        required: true
      task_type:
        description: 'bug（最小 diff 修復）或 feature（開發新功能）'
        required: false
        default: 'bug'
      telegram_chat_id:
        description: '（選填）完成後回報結果的 Telegram chat id'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency: bug-fix-agent   # 一次只跑一個修復

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Fetch issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue view ${{ inputs.issue_number }} --json number,title,body,url > /tmp/issue.json

      - name: Run fix agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_FILE: /tmp/issue.json
          SUMMARY_FILE: /tmp/agent-summary.md
          TASK_TYPE: ${{ inputs.task_type }}
        run: node scripts/bug-fix-agent.mjs

      - name: Guard — changes exist, protected paths untouched
        run: |
          # Lockfile drift (npm/yarn/pnpm, anywhere in the repo) must never enter
          # a PR — .git/info/exclude only hides untracked files, it does NOT stop
          # already-tracked lockfiles (e.g. root yarn.lock) from being diffed and
          # committed. Discard any lockfile drift outright before checking "did
          # the agent change anything real".
          # Each pattern runs alone: `git checkout --` aborts the WHOLE command
          # (reverting nothing) if any one pathspec matches no tracked file, so
          # a single missing lockfile type must not block reverting the others.
          for pattern in 'package-lock.json' 'yarn.lock' 'pnpm-lock.yaml'; do
            git checkout -- ":(glob)**/$pattern" 2>/dev/null || true
            git clean -fd -- ":(glob)**/$pattern" 2>/dev/null || true
          done
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo '::error::agent 沒有做任何修改（可能判斷無法安全修復，見上方 log）'
            exit 1
          fi
          if git status --porcelain | awk '{print $2}' | grep -E '^\.github/workflows/|^scripts/bug-fix-agent\.mjs$'; then
            echo '::error::agent 動了保護路徑，拒絕開 PR'
            exit 1
          fi

      - name: Gates — tsc + eslint on changed files
        working-directory: apps/web
        run: |
          npx tsc --noEmit
          changed=$(git -C ../.. status --porcelain | awk '{print $2}' | grep -E '^apps/web/.*\.(ts|tsx)$' | sed 's|^apps/web/||' || true)
          if [ -n "$changed" ]; then npx eslint $changed; fi

      - name: Create PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_TYPE: ${{ inputs.task_type }}
        run: |
          if [ "$TASK_TYPE" = "feature" ]; then kind='feat'; label='開發'; else kind='fix'; label='修復'; fi
          branch="ai-${kind}/issue-${{ inputs.issue_number }}-${{ github.run_id }}"
          git config user.name 'contentloop-fix-agent'
          git config user.email 'noreply@anthropic.com'
          git checkout -b "$branch"
          git add -A
          git commit -m "🤖 ${kind}: AI ${label} Issue #${{ inputs.issue_number }}"
          git push origin "$branch"
          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "🤖 AI ${kind}: Issue #${{ inputs.issue_number }}" \
            --body-file /tmp/agent-summary.md)
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      # Phase 3C — report the outcome back to Telegram (only if a chat id was passed)
      - name: Notify Telegram (success)
        if: success() && inputs.telegram_chat_id != ''
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot$TG/sendMessage" \
            --data-urlencode "chat_id=${{ inputs.telegram_chat_id }}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=✅ Issue #${{ inputs.issue_number }} 完成，PR 已開，請到 GitHub review 後再 merge：${{ steps.pr.outputs.url }}" > /dev/null

      - name: Notify Telegram (failure)
        if: failure() && inputs.telegram_chat_id != ''
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot$TG/sendMessage" \
            --data-urlencode "chat_id=${{ inputs.telegram_chat_id }}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=❌ Issue #${{ inputs.issue_number }} 未完成（agent 可能判斷不能安全處理，或三關未過）。詳見 log：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
